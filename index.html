<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<title>文件資料庫管理系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg:#0d0f14; --surface:#151820; --surface2:#1c2030; --border:#252a3a;
    --text:#e8ecf4; --text-muted:#6b7490; --text-dim:#3d4460;
    --val:#185FA5; --val-light:#1e78d0; --val-bg:#0d1e35;
    --qm:#0F6E56;  --qm-light:#14a87e;  --qm-bg:#071e17;
    --sop:#534AB7; --sop-light:#7269e0; --sop-bg:#14123a;
    --wi:#D85A30;  --wi-light:#f07040;  --wi-bg:#351508;
    --form:#993556;--form-light:#c44870;--form-bg:#290d17;
    --status-active:#22c55e; --status-review:#f59e0b; --status-draft:#6b7490;
    --header-h:56px; --bottom-h:64px;
    --green:#22c55e; --red:#ef4444; --yellow:#f59e0b;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);
       min-height:100dvh;overflow-x:hidden}

  /* ── HEADER ── */
  header{position:fixed;top:0;left:0;right:0;z-index:200;
    background:rgba(13,15,20,.92);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);height:var(--header-h);
    display:flex;align-items:center;padding:0 12px;gap:10px}
  .logo{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
    color:var(--text-muted);letter-spacing:.08em;white-space:nowrap;flex-shrink:0}
  .logo span{color:var(--text)}
  .search-wrap{flex:1;position:relative}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    color:var(--text-muted);pointer-events:none}
  #searchInput{width:100%;height:38px;background:var(--surface2);
    border:1px solid var(--border);border-radius:10px;
    padding:0 12px 0 38px;color:var(--text);font-family:inherit;font-size:14px;
    outline:none;transition:border-color .2s;-webkit-appearance:none}
  #searchInput::placeholder{color:var(--text-muted)}
  #searchInput:focus{border-color:#3a4060}

  /* UPDATE BUTTON */
  #syncBtn{
    flex-shrink:0;height:38px;padding:0 12px;
    background:var(--surface2);border:1px solid var(--border);
    border-radius:10px;color:var(--text-muted);
    font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:500;
    display:flex;align-items:center;gap:6px;cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;
    white-space:nowrap;
  }
  #syncBtn:hover{color:var(--text);border-color:#3a4060}
  #syncBtn.syncing{color:var(--yellow);border-color:var(--yellow);background:rgba(245,158,11,.08)}
  #syncBtn.success{color:var(--green);border-color:var(--green);background:rgba(34,197,94,.08)}
  #syncBtn.error{color:var(--red);border-color:var(--red);background:rgba(239,68,68,.08)}
  #syncBtn svg{transition:transform .6s;flex-shrink:0}
  #syncBtn.syncing svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  #filterToggle{flex-shrink:0;width:38px;height:38px;background:var(--surface2);
    border:1px solid var(--border);border-radius:10px;color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:color .15s;position:relative}
  #filterToggle.has-filter{color:var(--val-light);border-color:var(--val)}
  #filterToggle .badge{position:absolute;top:-4px;right:-4px;width:8px;height:8px;
    border-radius:50%;background:var(--val-light);display:none}
  #filterToggle.has-filter .badge{display:block}

  /* ── SYNC TOAST ── */
  #syncToast{
    position:fixed;top:calc(var(--header-h) + 8px);left:50%;transform:translateX(-50%) translateY(-8px);
    z-index:300;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 20px;font-size:13px;color:var(--text-muted);
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;
    white-space:nowrap;
  }
  #syncToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── SYNC LOG DRAWER ── */
  #syncLogDrawer{position:fixed;inset:0;z-index:400;pointer-events:none}
  #syncLogDrawer.open{pointer-events:all}
  .sync-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);
    opacity:0;transition:opacity .25s}
  #syncLogDrawer.open .sync-backdrop{opacity:1}
  .sync-sheet{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--surface);border-radius:20px 20px 0 0;
    border-top:1px solid var(--border);
    padding:0 0 env(safe-area-inset-bottom,16px);
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    max-height:70dvh;display:flex;flex-direction:column;
  }
  #syncLogDrawer.open .sync-sheet{transform:translateY(0)}
  .sync-handle{width:36px;height:4px;border-radius:2px;
    background:var(--border);margin:12px auto 0}
  .sync-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .sync-title{font-size:15px;font-weight:700}
  .sync-close{background:none;border:none;color:var(--text-muted);cursor:pointer;
    padding:4px;font-size:20px;line-height:1}
  .sync-body{flex:1;overflow-y:auto;padding:16px 20px}
  .sync-step{
    display:flex;align-items:flex-start;gap:12px;
    padding:10px 0;border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .sync-step:last-child{border-bottom:none}
  .step-icon{flex-shrink:0;width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin-top:1px}
  .step-icon.pending{background:var(--surface2);color:var(--text-dim)}
  .step-icon.running{background:rgba(245,158,11,.15);color:var(--yellow)}
  .step-icon.done{background:rgba(34,197,94,.15);color:var(--green)}
  .step-icon.fail{background:rgba(239,68,68,.15);color:var(--red)}
  .step-text{flex:1}
  .step-label{color:var(--text);font-weight:500}
  .step-sub{color:var(--text-muted);font-size:11px;margin-top:2px;font-family:'JetBrains Mono',monospace}
  .sync-result-bar{
    padding:14px 20px;border-top:1px solid var(--border);
    flex-shrink:0;
  }
  .sync-done-btn{
    width:100%;height:46px;border-radius:12px;border:none;
    background:var(--val);color:#fff;font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;transition:opacity .15s;
  }
  .sync-done-btn:active{opacity:.8}

  /* ── FILTER DRAWER ── */
  #filterDrawer{position:fixed;inset:0;z-index:300;pointer-events:none}
  #filterDrawer.open{pointer-events:all}
  .drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);
    opacity:0;transition:opacity .25s}
  #filterDrawer.open .drawer-backdrop{opacity:1}
  .drawer-sheet{position:absolute;bottom:0;left:0;right:0;
    background:var(--surface);border-radius:20px 20px 0 0;
    border-top:1px solid var(--border);
    padding:0 0 env(safe-area-inset-bottom,16px);
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:80dvh;overflow-y:auto}
  #filterDrawer.open .drawer-sheet{transform:translateY(0)}
  .drawer-handle{width:36px;height:4px;border-radius:2px;
    background:var(--border);margin:12px auto 20px}
  .drawer-title{font-size:16px;font-weight:700;padding:0 20px 16px;
    border-bottom:1px solid var(--border)}
  .drawer-section{padding:16px 20px}
  .drawer-section-label{font-size:10px;font-weight:700;letter-spacing:.12em;
    color:var(--text-dim);text-transform:uppercase;margin-bottom:10px}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;
    border-radius:20px;border:1px solid var(--border);
    background:transparent;color:var(--text-muted);
    font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
    transition:all .15s;-webkit-appearance:none}
  .chip.active{background:var(--surface2);border-color:#3a4060;color:var(--text)}
  .chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .drawer-apply{margin:8px 20px 16px;width:calc(100% - 40px);height:48px;
    background:var(--val);border:none;border-radius:12px;
    color:#fff;font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;transition:opacity .15s}
  .drawer-apply:active{opacity:.8}

  /* ── PAGE ── */
  .page{padding-top:var(--header-h);
    padding-bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px))}

  /* STATS STRIP */
  .stats-strip{display:flex;gap:10px;padding:16px 16px 0;
    overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .stats-strip::-webkit-scrollbar{display:none}
  .stat-card{flex:0 0 auto;scroll-snap-align:start;
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;min-width:96px;
    position:relative;overflow:hidden;cursor:pointer;
    transition:opacity .15s;-webkit-tap-highlight-color:transparent}
  .stat-card:active{opacity:.7}
  .stat-card.active-filter{border-color:#3a4060}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
  .stat-card[data-cat="all"]::before{background:linear-gradient(90deg,var(--val),var(--form))}
  .stat-card[data-cat="0"]::before{background:var(--val)}
  .stat-card[data-cat="1"]::before{background:var(--qm)}
  .stat-card[data-cat="2"]::before{background:var(--sop)}
  .stat-card[data-cat="3"]::before{background:var(--wi)}
  .stat-card[data-cat="4"]::before{background:var(--form)}
  .stat-code{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-muted);margin-bottom:6px}
  .stat-num{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;line-height:1}
  .stat-label{font-size:10px;color:var(--text-muted);margin-top:3px;white-space:nowrap}

  /* TOOLBAR */
  .toolbar{display:flex;align-items:center;padding:12px 16px 8px;gap:10px}
  #resultCount{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);flex:1}
  #lastSyncTime{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim)}

  /* DOC LIST */
  #docGrid{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}
  .doc-card{background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:16px 16px 14px 19px;cursor:pointer;
    position:relative;overflow:hidden;animation:fadeUp .25s ease both;
    -webkit-tap-highlight-color:transparent;transition:opacity .15s;
    display:block;text-decoration:none;color:inherit}
  .doc-card:active{opacity:.75}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .doc-card-accent{position:absolute;top:0;left:0;width:3px;height:100%;border-radius:14px 0 0 14px}
  .doc-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
  .doc-code{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-bottom:3px}
  .doc-name{font-size:14px;font-weight:600;line-height:1.45;color:var(--text)}
  .doc-badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
    padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;
    letter-spacing:.05em;margin-top:2px}
  .doc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;
    padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)}
  .status-dot{display:inline-flex;align-items:center;gap:5px}
  .status-dot::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .status-dot.active::before{background:var(--status-active);box-shadow:0 0 5px var(--status-active)}
  .status-dot.review::before{background:var(--status-review)}
  .status-dot.draft::before{background:var(--status-draft)}
  .doc-open-btn{display:inline-flex;align-items:center;gap:5px;margin-left:auto;
    padding:4px 10px;background:var(--surface2);border:1px solid var(--border);
    border-radius:6px;color:var(--text-muted);font-size:11px;text-decoration:none;
    transition:color .15s;flex-shrink:0}
  .empty-state{text-align:center;padding:64px 0;color:var(--text-muted)}
  .empty-state svg{opacity:.3;margin-bottom:12px}
  .empty-state p{font-size:14px}

  /* ── BOTTOM NAV ── */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;
    background:rgba(13,15,20,.95);backdrop-filter:blur(20px);
    border-top:1px solid var(--border);height:var(--bottom-h);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;align-items:center;padding-left:4px;padding-right:4px}
  .nav-btn{flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;height:100%;
    background:none;border:none;color:var(--text-dim);
    font-family:inherit;font-size:9px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    transition:color .15s;-webkit-tap-highlight-color:transparent;position:relative}
  .nav-btn::before{content:'';position:absolute;top:0;left:8px;right:8px;height:2px;
    border-radius:0 0 2px 2px;opacity:0;transition:opacity .2s}
  .nav-btn.active{color:var(--text)}
  .nav-btn.active::before{opacity:1}
  .nav-btn[data-cat="all"]::before{background:linear-gradient(90deg,var(--val),var(--form))}
  .nav-btn[data-cat="0"]::before{background:var(--val-light)}
  .nav-btn[data-cat="1"]::before{background:var(--qm-light)}
  .nav-btn[data-cat="2"]::before{background:var(--sop-light)}
  .nav-btn[data-cat="3"]::before{background:var(--wi-light)}
  .nav-btn[data-cat="4"]::before{background:var(--form-light)}
  .nav-dot{width:6px;height:6px;border-radius:50%;margin-bottom:1px}
  .nav-btn[data-cat="all"] .nav-dot{background:linear-gradient(135deg,var(--val),var(--form))}
  .nav-btn[data-cat="0"]  .nav-dot{background:var(--val-light)}
  .nav-btn[data-cat="1"]  .nav-dot{background:var(--qm-light)}
  .nav-btn[data-cat="2"]  .nav-dot{background:var(--sop-light)}
  .nav-btn[data-cat="3"]  .nav-dot{background:var(--wi-light)}
  .nav-btn[data-cat="4"]  .nav-dot{background:var(--form-light)}
  .nav-count{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;line-height:1;margin-bottom:1px}

  /* ── AUTH OVERLAY ── */
  #authOverlay{
    position:fixed;inset:0;z-index:500;
    background:rgba(13,15,20,.97);backdrop-filter:blur(12px);
    display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;padding:32px;
  }
  #authOverlay.show{display:flex}
  .auth-icon{font-size:48px;margin-bottom:8px}
  .auth-title{font-size:18px;font-weight:700;text-align:center}
  .auth-sub{font-size:13px;color:var(--text-muted);text-align:center;line-height:1.6;max-width:280px}
  .auth-btn{
    margin-top:8px;height:48px;padding:0 32px;
    background:var(--val);border:none;border-radius:12px;
    color:#fff;font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;gap:10px;
    transition:opacity .15s;
  }
  .auth-btn:active{opacity:.8}
  .auth-cancel{background:none;border:none;color:var(--text-muted);
    font-family:inherit;font-size:13px;cursor:pointer;padding:8px}

  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo"><span>DMS</span></div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="searchInput" type="search" placeholder="搜尋文件、編號…" autocomplete="off">
  </div>
  <!-- 更新資料庫按鈕 -->
  <button id="syncBtn" onclick="startSync()" aria-label="更新資料庫">
    <svg id="syncIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
    更新
  </button>
  <button id="filterToggle" onclick="toggleDrawer()" aria-label="篩選">
    <div class="badge"></div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/>
    </svg>
  </button>
</header>

<!-- ── SYNC TOAST ── -->
<div id="syncToast"></div>

<!-- ── SYNC LOG DRAWER ── -->
<div id="syncLogDrawer">
  <div class="sync-backdrop" onclick="closeSyncLog()"></div>
  <div class="sync-sheet">
    <div class="sync-handle"></div>
    <div class="sync-header">
      <div class="sync-title">🔄 更新資料庫</div>
      <button class="sync-close" onclick="closeSyncLog()">×</button>
    </div>
    <div class="sync-body" id="syncLogBody"></div>
    <div class="sync-result-bar" id="syncResultBar" style="display:none">
      <button class="sync-done-btn" onclick="closeSyncLog()">完成</button>
    </div>
  </div>
</div>

<!-- ── FILTER DRAWER ── -->
<div id="filterDrawer">
  <div class="drawer-backdrop" onclick="toggleDrawer()"></div>
  <div class="drawer-sheet">
    <div class="drawer-handle"></div>
    <div class="drawer-title">篩選條件</div>
    <div class="drawer-section">
      <div class="drawer-section-label">狀態</div>
      <div class="chip-row">
        <button class="chip active" data-status="all" onclick="setStatus('all')">全部</button>
        <button class="chip" data-status="active" onclick="setStatus('active')">
          <span class="chip-dot" style="background:var(--status-active)"></span>生效中
        </button>
        <button class="chip" data-status="review" onclick="setStatus('review')">
          <span class="chip-dot" style="background:var(--status-review)"></span>審查中
        </button>
        <button class="chip" data-status="draft" onclick="setStatus('draft')">
          <span class="chip-dot" style="background:var(--status-draft)"></span>草稿
        </button>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-label">排序</div>
      <div class="chip-row">
        <button class="chip active" data-sort="date" onclick="setSort('date')">最近更新</button>
        <button class="chip" data-sort="name" onclick="setSort('name')">名稱</button>
        <button class="chip" data-sort="code" onclick="setSort('code')">文件編號</button>
      </div>
    </div>
    <button class="drawer-apply" onclick="toggleDrawer()">套用</button>
  </div>
</div>

<!-- ── AUTH OVERLAY ── -->
<div id="authOverlay">
  <div class="auth-icon">🔐</div>
  <div class="auth-title">需要 Google 授權</div>
  <div class="auth-sub">要從 Google Drive 抓取最新文件，請先授權存取您的雲端硬碟。</div>
  <button class="auth-btn" onclick="doGoogleAuth()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    使用 Google 帳號授權
  </button>

<script>

// ── 偵測副檔名→類別 ──────────────────────────────────────
function guessCatFromMime(mime) {
  if (mime === 'application/vnd.google-apps.folder') return null;
  return mime; // 回傳 mimeType 讓後面做 viewUrl
}

function mimeToViewUrl(fileId, mimeType) {
  if (mimeType === 'application/vnd.google-apps.document')     return `https://docs.google.com/document/d/${fileId}/edit`;
  if (mimeType === 'application/vnd.google-apps.spreadsheet')  return `https://docs.google.com/spreadsheets/d/${fileId}/edit`;
  if (mimeType === 'application/vnd.google-apps.presentation') return `https://docs.google.com/presentation/d/${fileId}/edit`;
  return `https://drive.google.com/file/d/${fileId}/view`;
}

// 從檔名推斷文件代碼與版本
function parseFileName(title) {
  // 例: "OWPC-02-0401-(H)風場..." → code=OWPC-02-0401, ver=Rev.H
  const verMatch = title.match(/[\-_\s]\(([A-Z0-9]+)\)/);
  const ver = verMatch ? `Rev.${verMatch[1]}` : 'Rev.—';
  // 取文件編號（前段英數-）
  const codeMatch = title.match(/^([A-Z0-9\-]+)/);
  const code = codeMatch ? codeMatch[1].replace(/[-_]+$/, '') : title.substring(0, 20);
  // 去掉副檔名與版本括號做為名稱
  let name = title
    .replace(/\.[a-z]{2,5}$/i, '')           // 去副檔名
    .replace(/[\-_\s]\([A-Z0-9]+\)/g, '')    // 去版本括號
    .replace(/^[A-Z0-9\-]+[\-_\s]+/,'')      // 去前綴編號
    .replace(/_\d{8}$/,'')                    // 去日期後綴
    .trim();
  if (!name) name = title;
  return { code, ver, name };
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let documents = loadLocalDocs();
let filterCat = 'all', filterStatus = 'all', sortMode = 'date', searchQ = '';
let drawerOpen = false, syncLogOpen = false;
let tokenClient = null, accessToken = null;

function loadLocalDocs() {
  try {
    const s = localStorage.getItem('dms_docs');
    return s ? JSON.parse(s) : getDefaultDocs();
  } catch(e) { return getDefaultDocs(); }
}
function saveDocs() {
  try { localStorage.setItem('dms_docs', JSON.stringify(documents)); } catch(e){}
}
function getDefaultDocs() {
  return [
    { code:'OWPC-00', name:'風場專案驗證方案', cat:0, ver:'Rev.A', status:'active', date:'2021-04-27', owner:'海洋產業處', dept:'船舶暨海洋產業研發中心', desc:'風場專案驗證方案總綱，涵蓋驗證申請流程、驗證人力資源、評鑑過程及驗證決定，符合 IEC 61400-22 與 CNS 15176-22。', viewUrl:'https://drive.google.com/file/d/1ENtiKkbkUslygwvqR6iodQbPwO5e_5cV/view' },
    { code:'OWPC-01', name:'風場專案驗證品質手冊', cat:1, ver:'Rev.F', status:'active', date:'2024-12-04', owner:'海洋產業處', dept:'船舶暨海洋產業研發中心', desc:'依 ISO/IEC 17065:2012 建立，涵蓋組織架構、資源要求、過程要求及管理系統文件管制等章節。', viewUrl:'https://drive.google.com/file/d/1lUP-VxMwt-wd5kSyQoQuh83ohUSkXD3Z/view' },
    { code:'OWPC-02-0401', name:'風場專案驗證功能組織權責說明作業', cat:2, ver:'Rev.H', status:'active', date:'2026-06-11', owner:'海洋產業處', dept:'船舶暨海洋產業研發中心', desc:'規範諮詢委員會、驗證執行幹事、驗證行政秘書及評估人員之職責與權限，符合 ISO/IEC 17065 第 5.1.3 節。', viewUrl:'https://drive.google.com/file/d/1PLhw7vZVw5oRswoF-b_keY8dfgY2-OED/view' },
    { code:'OWPC-03-0401-01', name:'風場專案驗證組織功能表', cat:3, ver:'Rev.A', status:'active', date:'2025-11-11', owner:'海洋產業處', dept:'船舶暨海洋產業研發中心', desc:'各工作事項之權責職位對應表，涵蓋政策制定、驗證活動制定、評估、審查及驗證決定等十四項工作。', viewUrl:'https://drive.google.com/file/d/15v5oPMCaMyxYQ8TLEaTPFrZA4d0LFzp2/view' },

  ];
}

// ── 最後同步時間 ─────────────────────────────────────────
function loadLastSync() {
  const t = localStorage.getItem('dms_last_sync');
  if (t) document.getElementById('lastSyncTime').textContent = '最後更新 ' + t;
}
function saveLastSync() {
  const now = new Date();
  const str = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  localStorage.setItem('dms_last_sync', str);
  document.getElementById('lastSyncTime').textContent = '最後更新 ' + str;
}

// ═══════════════════════════════════════════════════════════
// GOOGLE IDENTITY SERVICES (GIS) — OAuth 2.0 implicit flow
// ═══════════════════════════════════════════════════════════
function initGIS() {
  if (!window.google || GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID') return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) { setSyncError('授權失敗：' + resp.error); return; }
      accessToken = resp.access_token;
      hideAuth();
      doSync();
    },
  });
}

function doGoogleAuth() {
  if (!tokenClient) {
    showToast('❌ 請先設定 Google Client ID', 'error'); return;
  }
  hideAuth();
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

// ── SYNC ENTRY POINT ─────────────────────────────────────
async function startSync() {
  if (GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID') {
    showToast('⚠️ 請先設定 Google Client ID', 'error', 3000); return;
  }
  if (!accessToken) {
    showAuth(); return;
  }
  doSync();
}

async function doSync() {
  openSyncLog();
  setSyncBtnState('syncing');

  const steps = FOLDER_MAP.map(f => ({
    ...f, status:'pending', count:0, files:[]
  }));

  renderSyncSteps(steps);

  let allDocs = [];
  let anyError = false;

  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    step.status = 'running';
    renderSyncSteps(steps);

    try {
      const files = await fetchFolderFiles(step.id);
      step.files = files;
      step.count = files.length;
      step.status = 'done';

      files.forEach(f => {
        const { code, ver, name } = parseFileName(f.title);
        allDocs.push({
          code, ver, name,
          cat: step.cat,
          status: 'active',
          date: (f.modifiedTime || '').substring(0, 10) || '—',
          owner: f.owners?.[0]?.displayName || '—',
          dept: '船舶暨海洋產業研發中心',
          desc: f.description || f.contentSnippet || `${CAT_META[step.cat].name}文件`,
          viewUrl: mimeToViewUrl(f.id, f.mimeType),
        });
      });
    } catch(e) {
      step.status = 'fail';
      step.error = e.message;
      anyError = true;
      if (e.message.includes('401') || e.message.includes('403')) {
        accessToken = null;
      }
    }

    renderSyncSteps(steps);
    await sleep(200);
  }

  if (allDocs.length > 0) {
    documents = allDocs;
    saveDocs();
    saveLastSync();
    updateCounts();
    render();
  }

  setSyncBtnState(anyError ? 'error' : 'success');
  setTimeout(() => setSyncBtnState('idle'), 3000);
  document.getElementById('syncResultBar').style.display = 'block';
}

async function fetchFolderFiles(folderId) {
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType != 'application/vnd.google-apps.folder'`);
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id%2Cname%2CmimeType%2CmodifiedTime%2Cowners)&pageSize=200`;

  const res = await fetch(url, {
    method: 'GET',
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      'Accept': 'application/json',
    }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(res.status + ' ' + (err?.error?.message || res.statusText));
  }
  const data = await res.json();
  return (data.files || []).map(f => ({ ...f, title: f.name }));
}

// ── SYNC LOG UI ───────────────────────────────────────────
const STEP_ICONS = {
  pending: `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>`,
  running: `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin .8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  done:    `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
  fail:    `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
};

function renderSyncSteps(steps) {
  const body = document.getElementById('syncLogBody');
  body.innerHTML = steps.map(s => `
    <div class="sync-step">
      <div class="step-icon ${s.status}">${STEP_ICONS[s.status]}</div>
      <div class="step-text">
        <div class="step-label">${s.label}</div>
        <div class="step-sub">${
          s.status === 'pending' ? '等待中…' :
          s.status === 'running' ? '讀取資料夾中…' :
          s.status === 'done'    ? `✓ 找到 ${s.count} 個檔案` :
                                   `✗ ${s.error || '未知錯誤'}`
        }</div>
      </div>
    </div>
  `).join('');
}

function openSyncLog() {
  syncLogOpen = true;
  document.getElementById('syncResultBar').style.display = 'none';
  document.getElementById('syncLogBody').innerHTML = '';
  document.getElementById('syncLogDrawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSyncLog() {
  syncLogOpen = false;
  document.getElementById('syncLogDrawer').classList.remove('open');
  document.body.style.overflow = '';
}

function setSyncBtnState(state) {
  const btn = document.getElementById('syncBtn');
  btn.className = '';
  if (state !== 'idle') btn.classList.add(state);
  const labels = { syncing:'同步中…', success:'已更新 ✓', error:'失敗 ✗', idle:'更新' };
  btn.childNodes[btn.childNodes.length - 1].textContent = ' ' + (labels[state] || '更新');
}

function setSyncError(msg) {
  setSyncBtnState('error');
  showToast('❌ ' + msg, 'error', 3000);
  setTimeout(() => setSyncBtnState('idle'), 3000);
}

// ── AUTH OVERLAY ──────────────────────────────────────────
function showAuth()  { document.getElementById('authOverlay').classList.add('show'); }
function hideAuth()  { document.getElementById('authOverlay').classList.remove('show'); }

// ── TOAST ─────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type='info', dur=2000) {
  const el = document.getElementById('syncToast');
  el.textContent = msg;
  el.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ═══════════════════════════════════════════════════════════
// UI — FILTER / CAT / RENDER
// ═══════════════════════════════════════════════════════════
function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById('filterDrawer').classList.toggle('open', drawerOpen);
  document.body.style.overflow = drawerOpen ? 'hidden' : '';
}
function setStatus(st) {
  filterStatus = st;
  document.querySelectorAll('[data-status]').forEach(b =>
    b.classList.toggle('active', b.dataset.status === st));
  document.getElementById('filterToggle').classList.toggle('has-filter', st !== 'all');
  render();
}
function setSort(s) {
  sortMode = s;
  document.querySelectorAll('[data-sort]').forEach(b =>
    b.classList.toggle('active', b.dataset.sort === s));
  render();
}
function setCat(cat) {
  filterCat = cat;
  document.querySelectorAll('.stat-card').forEach(c =>
    c.classList.toggle('active-filter', c.dataset.cat === cat));
  document.querySelectorAll('.nav-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === cat));
  render();
}

function getFiltered() {
  return documents.filter(d => {
    if (filterCat !== 'all' && d.cat !== parseInt(filterCat)) return false;
    if (filterStatus !== 'all' && d.status !== filterStatus) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (![d.name, d.code, d.dept, d.owner].some(f => (f||'').toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

function render() {
  let list = getFiltered();
  if (sortMode === 'date') list.sort((a,b) => b.date.localeCompare(a.date));
  else if (sortMode === 'name') list.sort((a,b) => a.name.localeCompare(b.name, 'zh-TW'));
  else list.sort((a,b) => a.code.localeCompare(b.code));

  document.getElementById('resultCount').textContent = `共 ${list.length} 筆`;
  const grid = document.getElementById('docGrid');

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg><p>找不到符合條件的文件</p></div>`;
    return;
  }
  grid.innerHTML = list.map((d, i) => {
    const cm = CAT_META[d.cat];
    return `
    <a class="doc-card" href="${d.viewUrl}" target="_blank" rel="noopener" style="animation-delay:${i*25}ms">
      <div class="doc-card-accent" style="background:${cm.color}"></div>
      <div class="doc-card-top">
        <div style="flex:1;min-width:0">
          <div class="doc-code">${d.code} · ${d.ver}</div>
          <div class="doc-name">${d.name}</div>
        </div>
        <span class="doc-badge" style="background:${cm.bg};color:${cm.light}">${cm.code}</span>
      </div>
      <div class="doc-meta">
        <span class="status-dot ${d.status}">${STATUS_LABEL[d.status]}</span>
        <span style="color:var(--text-dim)">·</span>
        <span>${d.date}</span>
        <a class="doc-open-btn" href="${d.viewUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
            <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>Drive
        </a>
      </div>
    </a>`;
  }).join('');
}

function updateCounts() {
  document.getElementById('s-all').textContent = documents.length;
  document.getElementById('nc-all').textContent = documents.length;
  [0,1,2,3,4].forEach(c => {
    const n = documents.filter(d => d.cat === c).length;
    document.getElementById(`s-${c}`).textContent = n;
    document.getElementById(`nc-${c}`).textContent = n;
  });
}

// ── SEARCH ────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value.trim(); render();
});

// ── INIT ──────────────────────────────────────────────────
window.addEventListener('load', () => {
  // 載入 GIS script
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = initGIS;
  document.head.appendChild(s);
});

updateCounts();
render();
loadLastSync();
</script>
