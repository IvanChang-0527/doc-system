<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf0f5">
<title>文件資料庫管理系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #fdf0f5;
    --surface: #ffffff;
    --surface2: #fdf4f8;
    --border: #f0dcea;
    --shadow: rgba(200,150,180,0.12);

    --text: #3d2b3d;
    --text-muted: #9b7fa0;
    --text-dim: #c4aac8;

    /* 類別色 — 粉彩版 */
    --val:      #7ba7d4; --val-light: #5b8fc4; --val-bg: #e8f0fa;
    --qm:       #7dc4a8; --qm-light:  #4ea882; --qm-bg:  #e4f5ee;
    --sop:      #a89ed4; --sop-light: #8878c4; --sop-bg: #ede9f8;
    --wi:       #e8a87c; --wi-light:  #d4834a; --wi-bg:  #fdf0e6;
    --form:     #e896b0; --form-light:#d4608a; --form-bg:#fde8f0;

    --ok:    #6cc48a;
    --warn:  #f0b96a;
    --err:   #e87a7a;
    --yellow:#f0b96a;
    --green: #6cc48a;
    --red:   #e87a7a;

    --header-h: 60px;
    --bottom-h: 68px;
    --radius: 16px;
    --radius-sm: 10px;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}

  /* ── HEADER ── */
  header{
    position:fixed;top:0;left:0;right:0;z-index:200;
    background:rgba(253,240,245,0.88);backdrop-filter:blur(20px);
    border-bottom:1.5px solid var(--border);
    height:var(--header-h);
    display:flex;align-items:center;padding:0 16px;gap:10px;
  }
  .logo{
    font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;
    color:var(--form-light);letter-spacing:.06em;white-space:nowrap;flex-shrink:0;
  }
  .logo-dot{color:var(--sop-light)}

  .search-wrap{flex:1;position:relative}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
  #searchInput::placeholder{color:var(--text-dim)}
  #searchInput:focus{border-color:var(--form);box-shadow:0 2px 12px rgba(232,150,176,.2)}

  #driveSearchBtn{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border-radius:50%;
    background:var(--surface2);border:1.5px solid var(--border);
    color:var(--text-muted);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s;flex-shrink:0;
  }
  #driveSearchBtn:hover{background:var(--val-bg);border-color:var(--val);color:var(--val-light)}
  #searchInput{width:100%;height:40px;
    background:var(--surface);
    border:1.5px solid var(--border);border-radius:20px;
    padding:0 46px 0 40px;
    color:var(--text);font-family:inherit;font-size:14px;
    outline:none;transition:border-color .2s,box-shadow .2s;
    box-shadow:0 2px 8px var(--shadow);
    -webkit-appearance:none;
  }

  #syncBtn{
    flex-shrink:0;height:40px;padding:0 14px;
    background:var(--surface);border:1.5px solid var(--border);
    border-radius:20px;color:var(--text-muted);
    font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;
    display:flex;align-items:center;gap:6px;cursor:pointer;
    transition:all .2s;white-space:nowrap;
    box-shadow:0 2px 8px var(--shadow);
  }
  #syncBtn:hover{color:var(--val-light);border-color:var(--val);box-shadow:0 4px 16px rgba(123,167,212,.2)}
  #syncBtn.syncing{color:var(--yellow);border-color:var(--yellow)}
  #syncBtn.success{color:var(--green);border-color:var(--green)}
  #syncBtn.error{color:var(--red);border-color:var(--red)}
  #syncBtn svg{flex-shrink:0}
  #syncBtn.syncing svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  #filterToggle{
    flex-shrink:0;width:40px;height:40px;
    background:var(--surface);border:1.5px solid var(--border);
    border-radius:50%;color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s;position:relative;
    box-shadow:0 2px 8px var(--shadow);
  }
  #filterToggle:hover{border-color:var(--sop);color:var(--sop-light)}
  #filterToggle.has-filter{color:var(--sop-light);border-color:var(--sop);background:var(--sop-bg)}
  #filterToggle .badge{position:absolute;top:-3px;right:-3px;width:9px;height:9px;
    border-radius:50%;background:var(--form-light);border:2px solid var(--bg);display:none}
  #filterToggle.has-filter .badge{display:block}

  /* TOAST */
  #syncToast{
    position:fixed;top:calc(var(--header-h)+10px);left:50%;
    transform:translateX(-50%) translateY(-8px);z-index:300;
    background:var(--surface);border:1.5px solid var(--border);border-radius:20px;
    padding:10px 20px;font-size:13px;color:var(--text-muted);
    box-shadow:0 8px 32px var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;
  }
  #syncToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* SYNC DRAWER */
  #syncLogDrawer{position:fixed;inset:0;z-index:400;pointer-events:none}
  #syncLogDrawer.open{pointer-events:all}
  .sync-backdrop{position:absolute;inset:0;background:rgba(61,43,61,.4);opacity:0;transition:opacity .25s}
  #syncLogDrawer.open .sync-backdrop{opacity:1}
  .sync-sheet{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--surface);border-radius:24px 24px 0 0;
    border-top:1.5px solid var(--border);
    padding:0 0 env(safe-area-inset-bottom,16px);
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    max-height:70dvh;display:flex;flex-direction:column;
  }
  #syncLogDrawer.open .sync-sheet{transform:translateY(0)}
  .sync-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:14px auto 0}
  .sync-header{padding:16px 20px 12px;border-bottom:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .sync-title{font-size:16px;font-weight:700;color:var(--text)}
  .sync-close{background:var(--surface2);border:1.5px solid var(--border);border-radius:50%;
    color:var(--text-muted);cursor:pointer;width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
  .sync-body{flex:1;overflow-y:auto;padding:16px 20px}
  .sync-step{display:flex;align-items:flex-start;gap:12px;padding:10px 0;
    border-bottom:1px solid var(--border);font-size:13px}
  .sync-step:last-child{border-bottom:none}
  .step-icon{flex-shrink:0;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin-top:1px}
  .step-icon.pending{background:var(--surface2);color:var(--text-dim)}
  .step-icon.running{background:rgba(240,185,106,.2);color:var(--yellow)}
  .step-icon.done{background:rgba(108,196,138,.2);color:var(--green)}
  .step-icon.fail{background:rgba(232,122,122,.2);color:var(--red)}
  .step-label{color:var(--text);font-weight:500}
  .step-sub{color:var(--text-muted);font-size:11px;margin-top:2px;font-family:'JetBrains Mono',monospace}
  .sync-result-bar{padding:14px 20px;border-top:1.5px solid var(--border);flex-shrink:0}
  .sync-done-btn{width:100%;height:48px;border-radius:24px;border:none;
    background:linear-gradient(135deg,var(--form),var(--sop));color:#fff;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s}
  .sync-done-btn:active{opacity:.8}

  /* FILTER DRAWER */
  #filterDrawer{position:fixed;inset:0;z-index:300;pointer-events:none}
  #filterDrawer.open{pointer-events:all}
  .drawer-backdrop{position:absolute;inset:0;background:rgba(61,43,61,.4);opacity:0;transition:opacity .25s}
  #filterDrawer.open .drawer-backdrop{opacity:1}
  .drawer-sheet{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--surface);border-radius:24px 24px 0 0;
    border-top:1.5px solid var(--border);
    padding:0 0 env(safe-area-inset-bottom,16px);
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:85dvh;overflow-y:auto;
  }
  #filterDrawer.open .drawer-sheet{transform:translateY(0)}
  .drawer-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:14px auto 20px}
  .drawer-title{font-size:17px;font-weight:700;padding:0 20px 14px;
    border-bottom:1.5px solid var(--border);color:var(--text)}
  .drawer-section{padding:16px 20px}
  .drawer-section-label{font-size:10px;font-weight:700;letter-spacing:.1em;
    color:var(--text-dim);text-transform:uppercase;margin-bottom:10px}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 14px;border-radius:20px;
    border:1.5px solid var(--border);background:var(--surface2);
    color:var(--text-muted);font-family:inherit;font-size:13px;font-weight:500;
    cursor:pointer;transition:all .15s;-webkit-appearance:none;
  }
  .chip.active{background:var(--form-bg);border-color:var(--form);color:var(--form-light)}
  .chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .drawer-apply{
    margin:8px 20px 16px;width:calc(100% - 40px);height:50px;
    background:linear-gradient(135deg,var(--form),var(--sop));
    border:none;border-radius:25px;
    color:#fff;font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;transition:opacity .15s;
    box-shadow:0 4px 16px rgba(168,142,212,.3);
  }
  .drawer-apply:active{opacity:.8}

  /* PAGE */
  .page{
    padding-top:var(--header-h);
    padding-bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px));
  }

  /* STATS STRIP */
  .stats-strip{
    display:flex;gap:10px;padding:16px 16px 0;
    overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .stats-strip::-webkit-scrollbar{display:none}

  .stat-card{
    flex:0 0 auto;scroll-snap-align:start;
    background:var(--surface);border:1.5px solid var(--border);
    border-radius:var(--radius);padding:14px 18px;min-width:100px;
    position:relative;overflow:hidden;cursor:pointer;
    transition:all .2s;box-shadow:0 2px 10px var(--shadow);
  }
  .stat-card:active{transform:scale(.96)}
  .stat-card.active-filter{box-shadow:0 4px 20px var(--shadow);transform:translateY(-2px)}
  .stat-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 var(--radius) var(--radius)}
  .stat-card[data-cat="all"]::before{background:linear-gradient(90deg,var(--val),var(--form))}
  .stat-card[data-cat="0"]::before{background:var(--val)}
  .stat-card[data-cat="1"]::before{background:var(--qm)}
  .stat-card[data-cat="2"]::before{background:var(--sop)}
  .stat-card[data-cat="3"]::before{background:var(--wi)}
  .stat-card[data-cat="4"]::before{background:var(--form)}
  .stat-code{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-muted);margin-bottom:6px}
  .stat-num{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;line-height:1}
  .stat-label{font-size:10px;color:var(--text-muted);margin-top:4px;white-space:nowrap}

  /* TOOLBAR */
  .toolbar{display:flex;align-items:center;padding:12px 16px 8px;gap:10px}
  #resultCount{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);flex:1}
  #lastSyncTime{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim)}

  /* DOC GRID */
  #docGrid{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}

  .doc-card{
    background:var(--surface);border:1.5px solid var(--border);
    border-radius:var(--radius);padding:16px 18px 14px;
    cursor:pointer;position:relative;overflow:hidden;
    animation:fadeUp .25s ease both;
    text-decoration:none;color:inherit;display:block;
    transition:all .2s;
    box-shadow:0 2px 10px var(--shadow);
  }
  .doc-card:active{transform:scale(.98);box-shadow:0 1px 4px var(--shadow)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .doc-card-accent{
    position:absolute;top:0;left:0;right:0;height:3px;
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .doc-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
  .doc-code{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);margin-bottom:4px}
  .doc-name{font-size:14px;font-weight:600;line-height:1.45;color:var(--text)}

  .doc-badge{
    font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
    padding:4px 9px;border-radius:10px;white-space:nowrap;flex-shrink:0;
    letter-spacing:.05em;margin-top:2px;
  }

  .doc-meta{
    display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;
    padding-top:10px;margin-top:10px;border-top:1.5px solid var(--border);
    font-size:11px;color:var(--text-muted);
  }
  .status-dot{display:inline-flex;align-items:center;gap:5px}
  .status-dot::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .status-dot.active::before{background:var(--ok)}
  .status-dot.review::before{background:var(--warn)}
  .status-dot.draft::before{background:var(--text-dim)}

  .doc-open-btn{
    display:inline-flex;align-items:center;gap:5px;margin-left:auto;
    padding:4px 12px;
    background:var(--surface2);border:1.5px solid var(--border);
    border-radius:12px;color:var(--text-muted);font-size:11px;
    text-decoration:none;transition:all .15s;flex-shrink:0;
  }
  .doc-open-btn:hover{border-color:var(--val);color:var(--val-light)}

  .empty-state{text-align:center;padding:64px 0;color:var(--text-muted)}
  .empty-state svg{opacity:.3;margin-bottom:12px}
  .empty-state p{font-size:14px}

  /* BOTTOM NAV */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:200;
    background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);
    border-top:1.5px solid var(--border);
    height:var(--bottom-h);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;align-items:center;padding-left:4px;padding-right:4px;
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;height:100%;
    background:none;border:none;color:var(--text-dim);
    font-family:inherit;font-size:9px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;transition:all .15s;position:relative;
  }
  .nav-btn.active{color:var(--form-light)}
  .nav-dot{width:7px;height:7px;border-radius:50%;margin-bottom:1px;transition:transform .2s}
  .nav-btn.active .nav-dot{transform:scale(1.4)}
  .nav-btn[data-cat="all"]  .nav-dot{background:linear-gradient(135deg,var(--val),var(--form))}
  .nav-btn[data-cat="0"]   .nav-dot{background:var(--val)}
  .nav-btn[data-cat="1"]   .nav-dot{background:var(--qm)}
  .nav-btn[data-cat="2"]   .nav-dot{background:var(--sop)}
  .nav-btn[data-cat="3"]   .nav-dot{background:var(--wi)}
  .nav-btn[data-cat="4"]   .nav-dot{background:var(--form)}
  .nav-count{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;line-height:1;margin-bottom:1px}

  /* AUTH OVERLAY */
  #authOverlay{
    position:fixed;inset:0;z-index:500;
    background:rgba(253,240,245,.97);backdrop-filter:blur(12px);
    display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;padding:32px;
  }
  #authOverlay.show{display:flex}
  .auth-icon{font-size:52px;margin-bottom:8px}
  .auth-title{font-size:20px;font-weight:700;text-align:center;color:var(--text)}
  .auth-sub{font-size:14px;color:var(--text-muted);text-align:center;line-height:1.7;max-width:280px}
  .auth-btn{
    margin-top:8px;height:50px;padding:0 32px;
    background:linear-gradient(135deg,var(--val),var(--sop));
    border:none;border-radius:25px;
    color:#fff;font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;gap:10px;
    box-shadow:0 4px 20px rgba(123,167,212,.3);
    transition:opacity .15s;
  }
  .auth-btn:active{opacity:.8}
  .auth-cancel{background:none;border:none;color:var(--text-muted);
    font-family:inherit;font-size:13px;cursor:pointer;padding:8px}

/* ── PASSWORD OVERLAY ── */
  #pwOverlay{
    position:fixed;inset:0;z-index:600;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;padding:32px;
  }
  #pwOverlay.hide{display:none}
  .pw-box{
    background:var(--surface);border:1.5px solid var(--border);
    border-radius:24px;padding:36px 32px;
    width:100%;max-width:340px;
    box-shadow:0 8px 40px var(--shadow);
    display:flex;flex-direction:column;align-items:center;gap:16px;
    text-align:center;
  }
  .pw-icon{font-size:44px}
  .pw-title{font-size:20px;font-weight:700;color:var(--text)}
  .pw-sub{font-size:13px;color:var(--text-muted);line-height:1.6}
  .pw-input{
    width:100%;height:48px;
    background:var(--surface2);border:1.5px solid var(--border);
    border-radius:24px;padding:0 20px;
    text-align:center;font-size:18px;font-family:'JetBrains Mono',monospace;
    color:var(--text);outline:none;letter-spacing:.2em;
    transition:border-color .2s;
  }
  .pw-input:focus{border-color:var(--form)}
  .pw-input.error{border-color:var(--red);animation:shake .3s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pw-btn{
    width:100%;height:50px;border-radius:25px;border:none;
    background:linear-gradient(135deg,var(--form),var(--sop));
    color:#fff;font-family:inherit;font-size:16px;font-weight:700;
    cursor:pointer;transition:opacity .15s;
    box-shadow:0 4px 16px rgba(168,142,212,.3);
  }
  .pw-btn:active{opacity:.8}
  .pw-error{font-size:12px;color:var(--red);height:16px;transition:opacity .2s}
</style>
</head>
<body>

<!-- ── PASSWORD OVERLAY ── -->
<div id="pwOverlay">
  <div class="pw-box">
    <div class="pw-icon">🔒</div>
    <div class="pw-title">文件資料庫系統</div>
    <div class="pw-sub">請輸入密碼以繼續</div>
    <input class="pw-input" id="pwInput" type="password" placeholder="••••••••"
      maxlength="20" autocomplete="off"
      onkeydown="if(event.key==='Enter')checkPw()">
    <div class="pw-error" id="pwError"></div>
    <button class="pw-btn" onclick="checkPw()">進入</button>
  </div>
</div>

<!-- ── HEADER ── -->
<header>
  <div class="logo">DMS<span class="logo-dot"> ·</span></div>
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="searchInput" type="search" placeholder="搜尋文件、編號…" autocomplete="off">
    <button id="driveSearchBtn" onclick="searchInDrive()" title="在 Google Drive 搜尋">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972a6.033 6.033 0 110-12.064c1.498 0 2.866.549 3.921 1.453l2.814-2.814A9.969 9.969 0 0012.545 2C7.021 2 2.543 6.477 2.543 12s4.478 10 10.002 10c8.396 0 10.249-7.85 9.426-11.748l-9.426-.013z"/>
      </svg>
    </button>
  </div>
  <button id="syncBtn" onclick="loadDocs()" aria-label="重新整理">
    <svg id="syncIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
    重新整理
  </button>
  <button id="filterToggle" onclick="toggleDrawer()" aria-label="篩選">
    <div class="badge"></div>

<script>
function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById('filterDrawer').classList.toggle('open', drawerOpen);
  document.body.style.overflow = drawerOpen ? 'hidden' : '';
}

const PW = '20260609';
function checkPw() {
  const val = document.getElementById('pwInput').value;
  const errEl = document.getElementById('pwError');
  if (val === PW) {
    sessionStorage.setItem('dms_auth', '1');
    document.getElementById('pwOverlay').classList.add('hide');
    errEl.textContent = '';
  } else {
    const inp = document.getElementById('pwInput');
    inp.classList.add('error');
    errEl.textContent = '密碼錯誤，請再試一次';
    inp.value = '';
    setTimeout(() => inp.classList.remove('error'), 400);

}
if (sessionStorage.getItem('dms_auth') === '1') {
  document.getElementById('pwOverlay').classList.add('hide');
}

const API_URL = 'https://dms-api-kappa.vercel.app/api/docs';

let documents = [];
let filterCat = 'all', filterStatus = 'all', sortMode = 'code', sortDir = 'asc', searchQ = '';
let drawerOpen = false;

async function loadDocs() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (data.success && data.docs.length > 0) {
      documents = data.docs;
      updateCounts();
      render();
      const now = new Date();
      const str = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      document.getElementById('lastSyncTime').textContent = '已更新 ' + str;
    }
  } catch(e) {
    console.error('載入失敗:', e);
    document.getElementById('lastSyncTime').textContent = '載入失敗，請重新整理';
  }
}
const CAT_META = [
  { code:'VAL',  name:'驗證方案',   color:'var(--val)',  light:'var(--val-light)',  bg:'var(--val-bg)'  },
  { code:'QM',   name:'品質手冊',   color:'var(--qm)',   light:'var(--qm-light)',   bg:'var(--qm-bg)'   },
  { code:'SOP',  name:'程序書',     color:'var(--sop)',  light:'var(--sop-light)',  bg:'var(--sop-bg)'  },
  { code:'WI',   name:'作業指導書', color:'var(--wi)',   light:'var(--wi-light)',   bg:'var(--wi-bg)'   },
  { code:'FORM', name:'表單',       color:'var(--form)', light:'var(--form-light)', bg:'var(--form-bg)' },
];
const STATUS_LABEL = { active:'生效中', review:'審查中', draft:'草稿' };

function mimeToViewUrl(fileId, mimeType) {
  if (mimeType === 'application/vnd.google-apps.document')     return `https://docs.google.com/document/d/${fileId}/edit`;
  if (mimeType === 'application/vnd.google-apps.spreadsheet')  return `https://docs.google.com/spreadsheets/d/${fileId}/edit`;
  if (mimeType === 'application/vnd.google-apps.presentation') return `https://docs.google.com/presentation/d/${fileId}/edit`;
  return `https://drive.google.com/file/d/${fileId}/view`;
}

function parseFileName(title) {
  // 抽出版本號 例: -(H) → Rev.H
  const verMatch = title.match(/[\-_\s]\(([A-Z0-9]+)\)/);
  const ver = verMatch ? `Rev.${verMatch[1]}` : 'Rev.—';
  // 抽出文件代碼：取連字號分隔的英數字前綴，到版本括號之前
  const codeMatch = title.match(/^([A-Z0-9][A-Z0-9\-]*[A-Z0-9])/);
  const code = codeMatch ? codeMatch[1] : title.substring(0, 20);
  // 名稱：完整檔名，只去掉副檔名與日期後綴
  let name = title
    .replace(/\.[a-z]{2,5}$/i, '')  // 去副檔名 .pdf .docx
    .replace(/_\d{8}$/, '')          // 去 _20250901 日期後綴
    .trim();
  if (!name) name = title;
  return { code, ver, name };
}

let documents = loadLocalDocs();
let filterCat = 'all', filterStatus = 'all', sortMode = 'code', sortDir = 'asc', searchQ = '';
let drawerOpen = false, syncLogOpen = false;
let tokenClient = null, accessToken = null;

function loadLocalDocs() {
  try {
    const s = localStorage.getItem('dms_docs');
    if (!s) return getDefaultDocs();
    const parsed = JSON.parse(s);
    // 過濾掉名稱為空或無效的資料
    const valid = parsed.filter(d => d && d.name && d.name.trim() !== '' && d.viewUrl);
    return valid.length > 0 ? valid : getDefaultDocs();
  } catch(e) { return getDefaultDocs(); }
}
function saveDocs() { try { localStorage.setItem('dms_docs', JSON.stringify(documents)); } catch(e){} }
function getDefaultDocs() {
  return [
    { code:'OWPC-00', name:'風場專案驗證方案', cat:0, ver:'Rev.A', status:'active', date:'2021-04-27', owner:'海洋產業處', dept:'船舶暨海洋產業研發中心', viewUrl:'https://drive.google.com/file/d/1ENtiKkbkUslygwvqR6iodQbPwO5e_5cV/view' },
    { code:'OWPC-01', name:'風場專案驗證品質手冊', cat:1, ver:'Rev.F', status:'active', date:'2024-12-04', owner:'海洋產業處', dept:'船舶暨海洋產業研發中心', viewUrl:'https://drive.google.com/file/d/1lUP-VxMwt-wd5kSyQoQuh83ohUSkXD3Z/view' },
    { code:'OWPC-02-0401', name:'風場專案驗證功能組織權責說明作業', cat:2, ver:'Rev.H', status:'active', date:'2026-06-11', owner:'海洋產業處', dept:'船舶暨海洋產業研發中心', viewUrl:'https://drive.google.com/file/d/1PLhw7vZVw5oRswoF-b_keY8dfgY2-OED/view' },
    { code:'OWPC-03-0401-01', name:'風場專案驗證組織功能表', cat:3, ver:'Rev.A', status:'active', date:'2025-11-11', owner:'海洋產業處', dept:'船舶暨海洋產業研發中心', viewUrl:'https://drive.google.com/file/d/15v5oPMCaMyxYQ8TLEaTPFrZA4d0LFzp2/view' },
    { code:'OWPC-04-0401-01', name:'風場專案驗證作業主要人員配置與代理人一覽表', cat:4, ver:'Rev.A', status:'active', date:'2026-06-08', owner:'海洋產業處', dept:'船舶暨海洋產業研發中心', viewUrl:'https://docs.google.com/document/d/1g3fIvRl4EJahnortSSF_4sHpAtEZ8566FED64DtzoGA/edit' },
  ];
}

function loadLastSync() {
  const t = localStorage.getItem('dms_last_sync');
  if (t) document.getElementById('lastSyncTime').textContent = '最後更新 ' + t;
}
function saveLastSync() {
  const now = new Date();
  const str = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  localStorage.setItem('dms_last_sync', str);
  document.getElementById('lastSyncTime').textContent = '最後更新 ' + str;
}

function initGIS() {
  if (!window.google) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: SCOPES,
    callback: (resp) => {
      if (resp.error) { setSyncError('授權失敗：' + resp.error); return; }
      accessToken = resp.access_token; hideAuth(); doSync();
    },
  });
}

function doGoogleAuth() {
  if (!tokenClient) { showToast('❌ 請先設定 Google Client ID', 'error'); return; }
  hideAuth(); tokenClient.requestAccessToken({ prompt: 'consent' });
}

async function startSync() {
  if (!accessToken) { showAuth(); return; }
  doSync();
}

async function doSync() {
  openSyncLog(); setSyncBtnState('syncing');
  const steps = FOLDER_MAP.map(f => ({ ...f, status:'pending', count:0, files:[] }));
  renderSyncSteps(steps);
  let allDocs = [], anyError = false;

  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    step.status = 'running'; renderSyncSteps(steps);
    try {
      const files = await fetchFolderFiles(step.id);
      step.files = files; step.count = files.length; step.status = 'done';
      files.forEach(f => {
        const { code, ver, name } = parseFileName(f.title);
        if (!name || name.trim() === '') return; // 跳過空名稱
        allDocs.push({ code, ver, name, cat: step.cat, status:'active',
          date: (f.modifiedTime||'').substring(0,10)||'—',
          owner: f.owners?.[0]?.displayName||'—',
          dept: '船舶暨海洋產業研發中心',
          viewUrl: mimeToViewUrl(f.id, f.mimeType),
        });
      });
    } catch(e) {
      step.status = 'fail'; step.error = e.message; anyError = true;
      if (e.message.includes('401')||e.message.includes('403')) accessToken = null;
    }
    renderSyncSteps(steps); await sleep(200);
  }
  if (allDocs.length > 0) { documents = allDocs; saveDocs(); saveLastSync(); updateCounts(); render(); }
  setSyncBtnState(anyError ? 'error' : 'success');
  setTimeout(() => setSyncBtnState('idle'), 3000);
  document.getElementById('syncResultBar').style.display = 'block';
}

async function fetchFolderFiles(folderId) {
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType != 'application/vnd.google-apps.folder'`);
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id%2Cname%2CmimeType%2CmodifiedTime%2Cowners)&pageSize=200`;
  const res = await fetch(url, { method:'GET', headers:{ 'Authorization':`Bearer ${accessToken}`, 'Accept':'application/json' } });
  if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(res.status+' '+(err?.error?.message||res.statusText)); }
  const data = await res.json();
  return (data.files||[]).map(f => ({ ...f, title: f.name }));
}

const STEP_ICONS = {
  pending:`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>`,
  running:`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin .8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  done:`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
  fail:`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
};

function renderSyncSteps(steps) {
  document.getElementById('syncLogBody').innerHTML = steps.map(s => `
    <div class="sync-step">
      <div class="step-icon ${s.status}">${STEP_ICONS[s.status]}</div>
      <div class="step-text">
        <div class="step-label">${s.label}</div>
        <div class="step-sub">${s.status==='pending'?'等待中…':s.status==='running'?'讀取資料夾中…':s.status==='done'?`✓ 找到 ${s.count} 個檔案`:`✗ ${s.error||'未知錯誤'}`}</div>
      </div>
    </div>`).join('');
}

function openSyncLog() {
  syncLogOpen = true;
  document.getElementById('syncResultBar').style.display = 'none';
  document.getElementById('syncLogBody').innerHTML = '';
  document.getElementById('syncLogDrawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSyncLog() {
  syncLogOpen = false;
  document.getElementById('syncLogDrawer').classList.remove('open');
  document.body.style.overflow = '';
}
function setSyncBtnState(state) {
  const btn = document.getElementById('syncBtn');
  btn.className = '';
  if (state !== 'idle') btn.classList.add(state);
  const labels = { syncing:'同步中…', success:'已更新 ✓', error:'失敗 ✗', idle:'更新' };
  btn.childNodes[btn.childNodes.length-1].textContent = ' '+(labels[state]||'更新');
}
function setSyncError(msg) { setSyncBtnState('error'); showToast('❌ '+msg,'error',3000); setTimeout(()=>setSyncBtnState('idle'),3000); }
function showAuth()  { document.getElementById('authOverlay').classList.add('show'); }
function hideAuth()  { document.getElementById('authOverlay').classList.remove('show'); }
let toastTimer;
function showToast(msg,type='info',dur=2000) {
  const el = document.getElementById('syncToast');
  el.textContent = msg; el.className = 'show';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'),dur);
}

function setStatus(st) {
  filterStatus = st;
  document.querySelectorAll('[data-status]').forEach(b=>b.classList.toggle('active',b.dataset.status===st));
  document.getElementById('filterToggle').classList.toggle('has-filter', st!=='all');
  render();
}
function setSort(s) {
  sortMode = s;
  document.querySelectorAll('[data-sort]').forEach(b=>b.classList.toggle('active',b.dataset.sort===s));
  render();
}
function setDir(d) {
  sortDir = d;
  document.querySelectorAll('[data-dir]').forEach(b=>b.classList.toggle('active',b.dataset.dir===d));
  render();
}
function setCat(cat) {
  filterCat = cat;
  document.querySelectorAll('.stat-card').forEach(c=>c.classList.toggle('active-filter',c.dataset.cat===cat));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  render();
}

function getFiltered() {
  return documents.filter(d => {
    if (filterCat!=='all' && d.cat!==parseInt(filterCat)) return false;
    if (filterStatus!=='all' && d.status!==filterStatus) return false;
    if (searchQ) { const q=searchQ.toLowerCase(); if (![d.name,d.code,d.dept,d.owner].some(f=>(f||'').toLowerCase().includes(q))) return false; }
    return true;
  });
}

function render() {
  let list = getFiltered();
  const dir = sortDir==='asc' ? 1 : -1;
  if (sortMode==='date'||sortMode==='mydate') list.sort((a,b)=>a.date.localeCompare(b.date)*dir);
  else if (sortMode==='myopen') list.sort((a,b)=>(parseInt(localStorage.getItem('open_'+a.code)||'0')-parseInt(localStorage.getItem('open_'+b.code)||'0'))*dir);
  else if (sortMode==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'zh-TW')*dir);
  else list.sort((a,b)=>a.code.localeCompare(b.code)*dir);

  document.getElementById('resultCount').textContent = `共 ${list.length} 筆`;
  const grid = document.getElementById('docGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>找不到符合條件的文件</p></div>`;
    return;
  }
  grid.innerHTML = list.map((d,i) => {
    const cm = CAT_META[d.cat];
    return `<a class="doc-card" href="${d.viewUrl}" target="_blank" rel="noopener" style="animation-delay:${i*25}ms" onclick="localStorage.setItem('open_${d.code}',Date.now())">
      <div class="doc-card-accent" style="background:linear-gradient(90deg,${cm.color},${cm.light})"></div>
      <div class="doc-card-top">
        <div style="flex:1;min-width:0">
          <div class="doc-name">${d.name}</div>
        </div>
        <span class="doc-badge" style="background:${cm.bg};color:${cm.light}">${cm.code}</span>
      </div>
    </a>`;
  }).join('');
}

function updateCounts() {
  const total = documents.length;
  document.getElementById('s-all').textContent = total;
  document.getElementById('nc-all').textContent = total;
  [0,1,2,3,4].forEach(c => {
    const n = documents.filter(d=>d.cat===c).length;
    document.getElementById(`s-${c}`).textContent = n;
    document.getElementById(`nc-${c}`).textContent = n;
  });
}

document.getElementById('searchInput').addEventListener('input', e => { searchQ = e.target.value.trim(); render(); });

function searchInDrive() {
  const q = document.getElementById('searchInput').value.trim();
  const url = q
    ? `https://drive.google.com/drive/search?q=${encodeURIComponent(q)}`
    : 'https://drive.google.com/drive/folders/1Dcuj5sz6Pj857xgERmAh2VJ7C5sxT22e';
  window.open(url, '_blank');
}

updateCounts();
render();
loadDocs();
</script>
</body>
